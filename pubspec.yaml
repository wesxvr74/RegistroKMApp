name: kmtracker
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Localização e Mapas
  geolocator: ^10.1.0
  google_maps_flutter: ^2.6.1

  # Firebase e utilitários
  cloud_firestore: ^5.6.9
  intl: ^0.20.2
  path_provider: ^2.1.5
  excel: ^4.0.6
  logging: ^1.3.0
  fluttertoast: ^8.2.12

  # Ícones estilo iOS
  cupertino_icons: ^1.0.8
  firebase_auth: ^5.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^5.0.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "web/icons/Logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
